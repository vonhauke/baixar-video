name: Release

# Gera o SnapYou para Windows e Mac e, quando a execucao vem de uma tag "v*",
# publica uma release com os tres arquivos. Rodando manualmente (Actions >
# Release > Run workflow) so gera os arquivos, sem publicar nada.
#
# Para publicar uma versao nova:
#   git tag v2.1
#   git push origin v2.1

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYINSTALLER: "6.22.2"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # build_exe.py procura o ffmpeg em C:\ffmpeg\bin; baixamos o mesmo build
      # (gyan.dev, "essentials") que se usa localmente e conferimos o SHA-256.
      - name: ffmpeg
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $hashFile = Join-Path $env:RUNNER_TEMP "ffmpeg.zip.sha256"
          $base = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest $base -OutFile $zip
          Invoke-WebRequest "$base.sha256" -OutFile $hashFile
          $esperado = ((Get-Content $hashFile -Raw).Trim() -split '\s+')[0]
          $obtido = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($obtido -ne $esperado) { throw "SHA-256 do ffmpeg nao confere: $obtido (esperado $esperado)" }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "ffmpeg")
          $ff = Get-ChildItem (Join-Path $env:RUNNER_TEMP "ffmpeg") -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force C:\ffmpeg\bin | Out-Null
          Copy-Item (Join-Path $ff.DirectoryName "ffmpeg.exe"), (Join-Path $ff.DirectoryName "ffprobe.exe") C:\ffmpeg\bin
          & C:\ffmpeg\bin\ffmpeg.exe -version | Select-Object -First 1

      - name: Dependencias
        run: python -m pip install pyinstaller==${{ env.PYINSTALLER }} pillow yt-dlp customtkinter

      - name: Gerar o .exe
        run: python build_exe.py

      - name: Teste de abertura e do ffmpeg embutido
        shell: pwsh
        run: |
          $p = Start-Process dist\SnapYou.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "SnapYou fechou sozinho (codigo $($p.ExitCode))" }
          $mei = Get-ChildItem $env:TEMP -Directory -Filter "_MEI*" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $mei) { throw "Nao achei a pasta de arquivos extraidos (_MEI*)" }
          $ff = Join-Path $mei.FullName "ffmpeg\ffmpeg.exe"
          if (-not (Test-Path $ff)) { throw "ffmpeg.exe nao esta dentro do app" }
          & $ff -version | Select-Object -First 1
          Stop-Process -Id $p.Id -Force

      - name: Separar o arquivo da release
        shell: pwsh
        run: |
          New-Item -ItemType Directory saida | Out-Null
          Copy-Item dist\SnapYou.exe saida\SnapYou-Windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: saida/*
          retention-days: 3
          if-no-files-found: error

  mac:
    strategy:
      fail-fast: false
      matrix:
        # O ffmpeg do Homebrew exige o macOS em que foi compilado, entao o
        # servidor escolhido define a versao minima do app. "macos_minimo" e
        # o que prometemos nas notas da release; o teste falha se passar disso.
        include:
          - runner: macos-14
            sufixo: AppleSilicon
            macos_minimo: "14.0"
          - runner: macos-15-intel
            sufixo: Intel
            macos_minimo: "15.0"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # mac/build_mac.py embute o ffmpeg e o ffprobe achados no PATH
      - name: ffmpeg (Homebrew)
        run: |
          brew install ffmpeg
          ffmpeg -version | head -1

      - name: Dependencias
        run: python -m pip install pyinstaller==${{ env.PYINSTALLER }} pillow yt-dlp customtkinter

      - name: Gerar o .app
        run: python mac/build_mac.py

      # Abre o app, espera, e confere que o ffmpeg embutido nao depende de
      # bibliotecas do Homebrew (que um Mac sem Homebrew nao tem).
      - name: Teste de abertura e do ffmpeg embutido
        run: |
          mac/dist/SnapYou.app/Contents/MacOS/SnapYou &
          PID=$!
          sleep 25
          if ! kill -0 "$PID" 2>/dev/null; then echo "SnapYou fechou sozinho"; exit 1; fi
          MEI=$(ls -d "${TMPDIR:-/tmp}"/_MEI* | head -1)
          echo "Arquivos extraidos em: $MEI"
          ls -la "$MEI/ffmpeg" || { echo "pasta ffmpeg nao encontrada dentro do app"; exit 1; }
          FALHA=0
          echo "--- caminhos de busca (LC_RPATH) do ffmpeg embutido ---"
          otool -l "$MEI/ffmpeg/ffmpeg" | grep -A2 LC_RPATH || echo "(nenhum)"
          # O que importa e de onde o ffmpeg carrega as bibliotecas de verdade:
          # elas tem de vir de dentro do app, nao do Homebrew.
          echo "--- bibliotecas que o ffmpeg embutido carrega ---"
          if ! DYLD_PRINT_LIBRARIES=1 "$MEI/ffmpeg/ffmpeg" -version > "$RUNNER_TEMP/ffmpeg_libs.txt" 2>&1; then
            cat "$RUNNER_TEMP/ffmpeg_libs.txt"; echo "ffmpeg embutido nao executa"; FALHA=1
          fi
          grep -E "\.dylib" "$RUNNER_TEMP/ffmpeg_libs.txt" | grep -v -E "/usr/lib/|/System/" | sed -E 's/^dyld\[[0-9]+\]: //' || true
          if grep -E "\.dylib" "$RUNNER_TEMP/ffmpeg_libs.txt" | grep -q -E "/opt/homebrew|/usr/local/"; then
            echo "ATENCAO: o ffmpeg embutido esta usando bibliotecas do Homebrew, que um Mac sem Homebrew nao tem"
            FALHA=1
          fi
          if ! grep -q -E "libavcodec" "$RUNNER_TEMP/ffmpeg_libs.txt"; then
            echo "ATENCAO: nao vi libavcodec ser carregada"; FALHA=1
          fi
          grep -m1 "ffmpeg version" "$RUNNER_TEMP/ffmpeg_libs.txt" || true
          echo "--- versao minima do macOS exigida pelo app ---"
          MAX=$(for f in $(find "$MEI" -type f \( -name "ffmpeg" -o -name "ffprobe" -o -name "*.dylib" -o -name "*.so" \)); do
            otool -l "$f" 2>/dev/null | awk '/LC_BUILD_VERSION/{b=1} b && /minos/{print $2; b=0} /LC_VERSION_MIN_MACOSX/{m=1} m && /version/{print $2; m=0}'
          done | sort -V | tail -1)
          MINIMO="${{ matrix.macos_minimo }}"
          echo "maior exigencia encontrada: macOS $MAX (prometido: $MINIMO)"
          if [ -z "$MAX" ] || [ "$(printf '%s\n%s\n' "$MAX" "$MINIMO" | sort -V | tail -1)" != "$MINIMO" ]; then
            echo "ATENCAO: o app exige um macOS mais novo que o prometido ($MINIMO)"
            FALHA=1
          fi
          pkill -f "SnapYou.app/Contents/MacOS/SnapYou" || true
          exit $FALHA

      - name: Compactar o .app
        run: |
          mkdir saida
          ditto -c -k --sequesterRsrc --keepParent mac/dist/SnapYou.app "saida/SnapYou-Mac-${{ matrix.sufixo }}.zip"
          ls -la saida

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.sufixo }}
          path: saida/*
          retention-days: 3
          if-no-files-found: error

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: arquivos
          merge-multiple: true

      - name: Criar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la arquivos
          gh release create "$GITHUB_REF_NAME" arquivos/* \
            --title "SnapYou ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
